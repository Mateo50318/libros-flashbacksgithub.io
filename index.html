<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPEED BOOKING</title>
    <style>
        :root {
            --bg-color: #090a16;
            --card-bg: rgba(23, 18, 41, 0.7);
            --accent-celeste: #70d6ff;
            --accent-lila: #b5838d;
            --accent-violeta: #9d4edd;
            --text: #e0e1dd;
            --text-muted: #a0aab2;
            --aurora-glow: linear-gradient(135deg, #70d6ff, #c77dff, #7b2cbf);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 15%, rgba(112, 214, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(157, 78, 221, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(199, 125, 255, 0.08) 0%, transparent 60%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--accent-celeste), #e0aaff, #c77dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(157, 78, 221, 0.3);
            letter-spacing: 1px;
        }

        header p {
            color: #b8c0ec;
            font-size: 1.15rem;
            font-weight: 300;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 2.5rem;
            padding: 1rem;
        }

        /*Tarjetas estilo libro 3D*/
        .book-card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(12px);
        }

        .book-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 35px rgba(157, 78, 221, 0.4), 0 0 20px rgba(112, 214, 255, 0.3);
            border-color: transparent;
        }

        .book-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(112, 214, 255, 0.6), rgba(157, 78, 221, 0.2), rgba(199, 125, 255, 0.6));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.4s ease;
        }

        .book-card:hover::before {
            opacity: 1;
        }

        .book-cover-container {
            width: 100%;
            height: 350px;
            overflow: hidden;
            background: #121026;
            position: relative;
        }

        .book-cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease, filter 0.4s ease;
        }

        .book-card:hover .book-cover-container img {
            transform: scale(1.08);
            filter: brightness(1.1);
        }

        .book-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(23, 18, 41, 0.5) 0%, rgba(13, 10, 26, 0.8) 100%);
        }

        .book-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.4rem;
            line-height: 1.3;
        }

        .book-author {
            font-size: 0.85rem;
            color: var(--accent-celeste);
            font-weight: 500;
        }

        /* Modal con Animación de Libro Abriéndose */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 4, 12, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            perspective: 1500px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #15102a 0%, #0d0a1a 100%);
            border: 1px solid rgba(199, 125, 255, 0.3);
            border-radius: 16px;
            width: 100%;
            max-width: 750px;
            padding: 2.5rem;
            position: relative;
            box-shadow: 
                0 0 50px rgba(157, 78, 221, 0.3),
                0 25px 50px rgba(0, 0, 0, 0.8),
                inset 0 0 15px rgba(112, 214, 255, 0.1);
            transform-origin: left center;
            animation: bookOpen 0.7s cubic-bezier(0.15, 0.85, 0.35, 1.2) forwards;
            overflow: hidden;
        }

        /* Simulación de lomo de libro al abrir */
        .modal-content::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            background: linear-gradient(90deg, var(--accent-violeta), var(--accent-celeste));
            box-shadow: 2px 0 10px rgba(112, 214, 255, 0.5);
        }

        @keyframes bookOpen {
            0% {
                opacity: 0;
                transform: rotateY(-85deg) scale(0.7);
            }
            100% {
                opacity: 1;
                transform: rotateY(0deg) scale(1);
            }
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            color: var(--text-muted);
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #ffffff;
            background: rgba(157, 78, 221, 0.4);
            border-color: var(--accent-celeste);
            transform: rotate(90deg);
        }

        .flashback-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .flashback-header h2 {
            font-size: 2rem;
            background: linear-gradient(90deg, #ffffff, #e0aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        .flashback-header p {
            color: var(--accent-celeste);
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .flashback-body {
            background: rgba(9, 7, 19, 0.7);
            padding: 1.8rem;
            border-radius: 12px;
            border-left: 4px solid var(--accent-violeta);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            font-size: 1.1rem;
            line-height: 1.7;
            color: #d8e2dc;
            min-height: 130px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .flashback-body::before {
            content: '“';
            position: absolute;
            top: -10px;
            left: 10px;
            font-size: 4rem;
            color: rgba(157, 78, 221, 0.15);
            font-family: Georgia, serif;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Biblioteca Interactiva</h1>
        <p>Seleccioná alguna de estas obras que merecen ser leídas</p>
    </header>

    <div class="container" id="bookGrid"></div>

    <div class="modal" id="flashbackModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <div class="flashback-container">
                <div class="flashback-header">
                    <h2 id="modalTitle">Título del Libro</h2>
                    <p id="modalAuthor">Autor</p>
                </div>
                <div class="flashback-body" id="modalFlashback"></div>
            </div>
        </div>
    </div>

    <script>
        const books = [
            {
                title: "Rebelión en la granja",
                author: "George Orwell",
                cover: "rebelion.jpg.jpeg",
                flashback: "Una comunidad decide que es hora de cambiar las reglas y construir un futuro más justo. Pero cuando el poder cambia de manos, aparece una pregunta difícil de ignorar: ¿es posible crear una sociedad verdaderamente igualitaria?"
            },
            {
                title: "La ciudad y los perros",
                author: "Mario Vargas Llosa",
                cover: "perros.jpg.jpeg",
                flashback: "Dentro de un colegio militar, la disciplina convive con las rivalidades, los secretos y las jerarquías que marcan la vida de sus estudiantes. En un ambiente donde la presión es constante, cada decisión puede poner a prueba la lealtad y el valor de quienes intentan encontrar su lugar."
            },
            {
                title: "Boulevard",
                author: "Flor M. Salvador",
                cover: "boulevard.jpg.png",
                flashback: "A veces, dos personas se encuentran de manera inesperada y cambian la forma en que entienden el mundo. Una historia sobre el amor, los vínculos y las emociones que aparecen cuando conocemos a alguien que también lleva sus propias heridas."
            },
            {
                title: "Lionel Messi: El Distinto",
                author: "Olé – Marcelo Sottile",
                cover: "messi.jpg.png",
                flashback: "Detrás de uno de los nombres más reconocidos del fútbol existe una historia de comienzos humildes, esfuerzo y pasión por el deporte. Un recorrido por la vida de un jugador que, con talento y perseverancia, llegó a inspirar a millones de personas."
            },
            {
                title: "El Principito",
                author: "Antoine de Saint-Exupéry",
                cover: "principito.jpg.png",
                flashback: "Un encuentro inesperado da comienzo a un viaje por mundos extraordinarios y preguntas que parecen sencillas, pero esconden grandes verdades. A través de una mirada curiosa, esta historia invita a reflexionar sobre la amistad, el amor y aquello que realmente importa."
            },
            {
                title: "Las Gemelas de Auschwitz",
                author: "Eva Mozes Kor – Lisa Rojany Buccieri",
                cover: "auschwitz.jpg.jpg",
                flashback: "En uno de los capítulos más dolorosos de la historia, dos hermanas atraviesan una experiencia que pondrá a prueba sus vidas y su vínculo. Un testimonio sobre la supervivencia, la memoria y la importancia de no olvidar a quienes vivieron el horror del Holocausto."
            },
            {
                title: "Egresados",
                author: "Santiago L. Speranza",
                cover: "egresados.jpg.png",
                flashback: "Un viaje pensado para celebrar el final de una etapa reúne a un grupo de jóvenes lejos de su vida cotidiana. Lo que parecía una experiencia inolvidable pronto los enfrenta a situaciones inesperadas, poniendo a prueba sus amistades y la confianza entre ellos."
            },
            {
                title: "Cadáver Exquisito",
                author: "Agustina Bazterrica",
                cover: "cadaver.jpg.png",
                flashback: "¿Qué ocurre cuando una sociedad empieza a aceptar como normal aquello que antes consideraba impensable? En un mundo donde los límites de la ética se han transformado, esta historia plantea preguntas inquietantes sobre la humanidad, la crueldad y la facilidad con la que pueden cambiar nuestros valores."
            },
            {
                title: "La biblioteca de Media Noche",
                author: "Matt Haig",
                cover: "medianoche.jpg.png",
                flashback: "¿Alguna vez te preguntaste cómo sería tu vida si hubieras tomado otro camino? Entre las decisiones que tomamos y las oportunidades que dejamos atrás, esta historia invita a explorar las posibilidades, los arrepentimientos y el significado de encontrar nuestro propio lugar en el mundo."
            },
            {
                title: "Historia de David y Goliat",
                author: "Samuel",
                cover: "biblia.jpg.png",
                flashback: "Ante un desafío que parece imposible de superar, un joven pastor se enfrenta a una situación que pondrá a prueba su valentía, su fe y sus convicciones. Una historia que recuerda que la fuerza no siempre se mide por el tamaño o el poder, y que el coraje puede surgir de donde menos se espera."
            }
        ];

        const grid = document.getElementById('bookGrid');
        const modal = document.getElementById('flashbackModal');
        const closeModal = document.getElementById('closeModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalAuthor = document.getElementById('modalAuthor');
        const modalFlashback = document.getElementById('modalFlashback');

        function renderBooks() {
            grid.innerHTML = '';
            books.forEach((book) => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-cover-container">
                        <img src="${book.cover}" alt="${book.title}" onerror="this.src='https://via.placeholder.com/240x350?text=Sin+Imagen'">
                    </div>
                    <div class="book-info">
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">${book.author}</div>
                    </div>
                `;
                card.addEventListener('click', () => openFlashback(book));
                grid.appendChild(card);
            });
        }

        function openFlashback(book) {
            modalTitle.textContent = book.title;
            modalAuthor.textContent = book.author;
            modalFlashback.textContent = book.flashback;
            modal.classList.add('active');
        }

        closeModal.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        renderBooks();
    </script>
</body>
</html>
