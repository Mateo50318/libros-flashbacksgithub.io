<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Flashbacks Literarios</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent: #58a6ff;
            --text: #c9d1d9;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: #f0f6fc;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 2rem;
            padding: 1rem;
        }

        .book-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #30363d;
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 32px rgba(88, 166, 255, 0.2);
            border-color: var(--accent);
        }

        .book-cover-container {
            width: 100%;
            height: 350px;
            overflow: hidden;
            background: #21262d;
            position: relative;
        }

        .book-cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .book-card:hover .book-cover-container img {
            transform: scale(1.05);
        }

        .book-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .book-title {
            font-size: 1rem;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 0.3rem;
        }

        .book-author {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #f0f6fc;
        }

        .flashback-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .flashback-header h2 {
            font-size: 1.8rem;
            color: #f0f6fc;
            margin-bottom: 0.2rem;
        }

        .flashback-header p {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 500;
        }

        .flashback-body {
            background: #0d1117;
            padding: 1.5rem;
            border-radius: 10px;
            border-left: 4px solid var(--accent);
            font-size: 1.05rem;
            line-height: 1.6;
            color: #e6edf3;
            min-height: 120px;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Biblioteca Interactiva</h1>
        <p>Seleccioná un libro para descubrir su atmósfera y flashback sin spoilers</p>
    </header>

    <div class="container" id="bookGrid"></div>

    <div class="modal" id="flashbackModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <div class="flashback-container">
                <div class="flashback-header">
                    <h2 id="modalTitle">Título del Libro</h2>
                    <p id="modalAuthor">Autor</p>
                </div>
                <div class="flashback-body" id="modalFlashback"></div>
            </div>
        </div>
    </div>

    <script>
        const books = [
            {
               {
    title: "Rebelión en la granja",
    author: "George Orwell",
    cover: "rebelion.jpg.jpeg",
    flashback: "Una comunidad decide que ya es hora de cambiar las reglas y construir un futuro más justo. Pero cuando el poder cambia de manos, surge una pregunta difícil de ignorar: ¿es posible crear una sociedad verdaderamente igualitaria?"
},
{
    title: "La ciudad y los perros",
    author: "Mario Vargas Llosa",
    cover: "perros.jpg.jpeg",
    flashback: "Detrás de los uniformes y la disciplina de un colegio militar se esconde un mundo marcado por las jerarquías, los secretos y las rivalidades. Una historia donde crecer significa enfrentarse a una realidad mucho más compleja de lo que parece."
},
{
    title: "Boulevard",
    author: "Flor M. Salvador",
    cover: "boulevard.jpg.png",
    flashback: "A veces, dos personas pueden encontrarse en el momento menos esperado y cambiar por completo la forma en que entienden el mundo. Una historia sobre el amor, las emociones y las complejidades de conectar con alguien que también tiene sus propias batallas."
},
{
    title: "Lionel Messi: El Distinto",
    author: "Olé – Marcelo Sottile",
    cover: "messi.jpg.png",
    flashback: "Detrás de uno de los nombres más reconocidos del deporte mundial existe una historia de comienzos humildes, desafíos y una pasión extraordinaria. Un recorrido por la vida de un futbolista que terminó convirtiéndose en un referente para generaciones enteras."
},
{
    title: "El Principito",
    author: "Antoine de Saint-Exupéry",
    cover: "principito.jpg.png",
    flashback: "Un encuentro inesperado da comienzo a un viaje por mundos extraordinarios y reflexiones sobre la vida. A través de una mirada sencilla, esta historia nos invita a redescubrir el valor de la amistad, el amor y aquellas cosas que muchas veces pasan inadvertidas."
},
{
    title: "Las Gemelas de Auschwitz",
    author: "Eva Mozes Kor – Lisa Rojany Buccieri",
    cover: "auschwitz.jpg.jpg",
    flashback: "En uno de los períodos más oscuros de la historia, dos hermanas enfrentan una realidad que jamás deberían haber conocido. Un testimonio sobre la supervivencia, los vínculos familiares y la capacidad humana de encontrar esperanza incluso en las circunstancias más difíciles."
},
{
    title: "Egresados",
    author: "Santiago L. Speranza",
    cover: "egresados.jpg.png",
    flashback: "Lo que comienza como una experiencia para celebrar el final de una etapa pronto adquiere un significado inesperado. Una historia que pone a prueba los vínculos, las decisiones y los límites de un grupo de jóvenes cuando las cosas dejan de salir como esperaban."
},
            
            {
                title: "Cadáver Exquisito",
                author: "Agustina Bazterrica",
                cover: "cadaver.jpg.png",
                flashback: "¿Qué sucede cuando aquello que consideramos impensable deja de ser una excepción y se convierte en parte de la vida cotidiana? En una sociedad donde los límites de la humanidad parecen haberse desdibujado, esta historia plantea preguntas incómodas sobre la moral, la crueldad y hasta dónde puede llegar el ser humano."
            },
            {
                title: "La biblioteca de Media Noche",
                author: "Matt Haig",
                cover: "medianoche.jpg.png",
                flashback: "Entre las decisiones que tomamos y los caminos que dejamos atrás, existe una pregunta que todos nos hemos hecho alguna vez: ¿qué habría pasado si hubiéramos elegido diferente? Una historia que invita a reflexionar sobre las oportunidades, los arrepentimientos y el verdadero significado de vivir."
            },
            {
                title: "Historia de David y Goliat",
                author: "Samuel",
                cover: "biblia.jpg.png",
                flashback: "En medio de un conflicto que parece imposible de superar, un joven pastor se encuentra frente a un desafío que pondrá a prueba su valentía, su fe y sus convicciones. Una historia sobre el coraje, la confianza y la fuerza que puede surgir de quienes menos se espera."
            }
        ];

        const grid = document.getElementById('bookGrid');
        const modal = document.getElementById('flashbackModal');
        const closeModal = document.getElementById('closeModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalAuthor = document.getElementById('modalAuthor');
        const modalFlashback = document.getElementById('modalFlashback');

        function renderBooks() {
            grid.innerHTML = '';
            books.forEach((book) => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-cover-container">
                        <img src="${book.cover}" alt="${book.title}" onerror="this.src='https://via.placeholder.com/240x350?text=Sin+Imagen'">
                    </div>
                    <div class="book-info">
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">${book.author}</div>
                    </div>
                `;
                card.addEventListener('click', () => openFlashback(book));
                grid.appendChild(card);
            });
        }

        function openFlashback(book) {
            modalTitle.textContent = book.title;
            modalAuthor.textContent = book.author;
            modalFlashback.textContent = book.flashback;
            modal.classList.add('active');
        }

        closeModal.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        renderBooks();
    </script>
</body>
</html>
